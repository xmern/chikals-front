<!-- Backdrop -->
<div class="modal-backdrop" (click)="close()"></div>

<!-- Modal -->
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

  <button class="modal-close" (click)="close()" aria-label="Close">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <div class="modal-header">
    <h2 id="modal-title">Get in Touch</h2>
    <p>Choose how you'd like to reach us</p>
  </div>

  <!-- Message box -->
  <div class="modal-message-field">
    <label for="user-message">Your message <span>(optional)</span></label>
    <textarea
      id="user-message"
      [(ngModel)]="userMessage"
      rows="3"
      placeholder="Hi, I'd like to enquire about..."
    ></textarea>
  </div>

  <!-- Contact options -->
  <div class="modal-options">

    <!-- Email -->
    <a
      class="modal-option email"
      [href]="getEmailLink()"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Send us an email"
    >
      <div class="option-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="option-text">
        <span class="option-label">Email</span>
        <span class="option-detail">inboxchikals&#64;gmail.com</span>
      </div>
      <svg class="option-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <!-- WhatsApp -->
    <button
      class="modal-option whatsapp"
      (click)="openWhatsApp()"
      aria-label="Chat on WhatsApp"
    >
      <div class="option-icon">
        <!-- WhatsApp logo mark -->
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 32 32" fill="currentColor">
          <path d="M16 2C8.268 2 2 8.268 2 16c0 2.478.664 4.797 1.82 6.795L2 30l7.42-1.795A13.94 13.94 0 0 0 16 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.6a11.56 11.56 0 0 1-5.898-1.612l-.422-.252-4.404 1.065 1.107-4.28-.276-.44A11.558 11.558 0 0 1 4.4 16C4.4 9.59 9.59 4.4 16 4.4S27.6 9.59 27.6 16 22.41 27.6 16 27.6zm6.34-8.64c-.347-.174-2.055-1.013-2.374-1.129-.319-.116-.551-.174-.784.174-.232.347-.9 1.129-1.103 1.362-.202.232-.405.261-.752.087-.347-.174-1.464-.54-2.787-1.72-1.03-.918-1.725-2.052-1.928-2.4-.202-.347-.022-.535.152-.708.156-.155.347-.405.52-.608.174-.202.232-.347.347-.578.116-.232.058-.434-.029-.608-.087-.174-.784-1.89-1.074-2.587-.283-.68-.57-.588-.784-.599l-.666-.012a1.277 1.277 0 0 0-.926.434c-.319.347-1.217 1.19-1.217 2.9s1.246 3.364 1.42 3.596c.174.232 2.452 3.742 5.942 5.248.83.358 1.479.572 1.984.732.834.265 1.593.228 2.192.138.669-.1 2.055-.84 2.345-1.652.29-.811.29-1.507.202-1.652-.086-.145-.319-.232-.666-.405z"/>
        </svg>
      </div>
      <div class="option-text">
        <span class="option-label">WhatsApp</span>
        <span class="option-detail">+234 802 279 9368</span>
      </div>
      <svg class="option-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <!-- Phone -->
    <a
      class="modal-option phone"
      href="tel:+2348022799368"
      aria-label="Call us"
    >
      <div class="option-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <div class="option-text">
        <span class="option-label">Phone</span>
        <span class="option-detail">+234 802 279 9368</span>
      </div>
      <svg class="option-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

  </div>
</div>
